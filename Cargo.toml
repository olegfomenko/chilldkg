[package]
name = "chilldkg-rs"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Rust implementation of the ChillDKG refers to the BlockstreamResearch BIP-FROST-DKG"

[dependencies]
k256 = { version = "0.13", features = ["alloc", "arithmetic", "expose-field"], default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
thiserror = "2.0"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
