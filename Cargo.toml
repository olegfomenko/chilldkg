[package]
name = "chilldkg-rs"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Rust implementation of the ChillDKG refers to the BlockstreamResearch BIP-FROST-DKG"

[dependencies]
k256 = { version = "0.13", features = ["alloc", "arithmetic", "expose-field"], default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
thiserror = "2.0"
zeroize = { version = "1", features = ["derive"] }
itertools = { version = "0.15.0", optional = true }

[dev-dependencies]
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }


[features]
signing = ["dep:itertools"]

[[test]]
name = "sign_nonce_vectors"
required-features = ["signing"]

[[test]]
name = "sign_vectors"
required-features = ["signing"]

[[test]]
name = "sign_agg_vectors"
required-features = ["signing"]

[[test]]
name = "sign_e2e"
required-features = ["signing"]
