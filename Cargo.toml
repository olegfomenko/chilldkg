[package]
name = "chilldkg"
version = "0.1.0"
edition = "2024"

[dependencies]
k256 = { version = "0.13", features = ["arithmetic", "expose-field"], default-features = false }
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
